[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envguard"
version = "0.1.0"
description = "Validate .env files against .env.example: missing, empty, mistyped and undeclared variables."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["tomli>=2.0; python_version < '3.11'"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Environment :: Console",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
envguard = "envguard.cli:main"

[tool.setuptools.packages.find]
include = ["envguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
